# Publishes to npm with provenance when a version tag (v*) is pushed.
# Authenticates with npm Trusted Publishing (OIDC), no token needed; configured on npm under the package settings:
# GitHub Actions, repo Dieer2/n8n-nodes-formempire, workflow release.yml.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm publish --provenance --access public --ignore-scripts
